<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HotBando</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HotBando">
  <meta name="theme-color" content="#FF7A30">
  <link rel="apple-touch-icon" href="/logo.png">
  <link href="/vendor/fonts/poppins/poppins.css" rel="stylesheet">
  <link href="/vendor/css/font-awesome.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/css/leaflet.css" />
  <script src="/vendor/js/tailwind.js"></script>
  <script>
    tailwind.config = {
      theme: {
        fontFamily: { sans: ['Poppins', 'sans-serif'] },
        extend: {
          colors: {
            brand: { 50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74', 400: '#fb923c', 500: '#FF7A30', 600: '#ea6a24', 700: '#c25a1e', 800: '#9a4a18', 900: '#7a3a12' }
          }
        }
      }
    }
  </script>
  <script defer src="/vendor/js/leaflet.js"></script>
  <script defer src="/vendor/js/chart.umd.min.js"></script>
  <script type="module" src="/src/main.js"></script>
  <script>
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      window.dispatchEvent(new CustomEvent('appinstallavailable'));
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      });
    }
  </script>
</head>
<body style="background:#0a0a0f;margin:0;padding:0">
  <div id="app"></div>
</body>
</html>
