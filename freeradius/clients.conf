# HotBando FreeRADIUS Clients Configuration
# Substituted at runtime by docker-entrypoint.sh
# Use ${VAR} syntax — replaced by entrypoint with env var values

client localhost {
    ipaddr = 127.0.0.1
    secret = ${RADIUS_SECRET}
    shortname = local
    nastype = other
}

client docker-network {
    ipaddr = 172.16.0.0/12
    secret = ${RADIUS_SECRET}
    shortname = docker-hosts
    nastype = other
    virtual_server = hotbando
}

$INCLUDE mikrotik.secret
