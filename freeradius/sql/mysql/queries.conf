# HotBando FreeRADIUS SQL Queries Configuration (FreeRADIUS 3.2.x)
# Included into mods-enabled/sql via $INCLUDE so rlm_sql reads these.
#
# Authorization is handled by the Perl module (perl/hotbando_auth.pl).
# The SQL module is used for ACCOUNTING only: it records sessions in the
# real HotBando `user_connection_logs` table.
#
# NOTE: numeric defaults use the double-wrapped %{%{Attr}:-default} form
# because this file is parsed as part of the module config.

# ============================================================================
# AUTHORIZATION QUERIES (unused — auth is done by the Perl module)
# ============================================================================

# ============================================================================
# ACCOUNTING QUERIES (FreeRADIUS 3.2.x block format)
# ============================================================================

accounting {
	reference = "%{tolower:type.%{%{Acct-Status-Type}:-%{Request-Processing-Stage}}.query}"

	type {

		accounting-on {
			-query = "SELECT true"
		}

		accounting-off {
			-query = "SELECT true"
		}

		# Called when a new session starts — creates a 'connect' record
		start {
			query = "\
				INSERT INTO user_connection_logs \
					(user_id, mac_address, router_id, ip_address, action, session_duration, bytes_uploaded, bytes_downloaded, timestamp) \
				SELECT \
					u.id, \
					'%{Calling-Station-Id}', \
					COALESCE(r.id, 0), \
					'%{NAS-IP-Address}', \
					'connect', \
					%{%{Acct-Session-Time}:-0}, \
					0, \
					0, \
					NOW() \
				FROM (SELECT 1) dummy \
				LEFT JOIN users u ON REPLACE(REPLACE(LOWER(u.mac_address), ':', ''), '-', '') = REPLACE(REPLACE(LOWER('%{Calling-Station-Id}'), ':', ''), '-', '') \
				LEFT JOIN mikrotiks r ON r.host = '%{NAS-IP-Address}' OR r.router_id = '%{NAS-Identifier}' \
				LIMIT 1"
		}

		# Called periodically during an active session — updates the latest 'connect' record
		interim-update {
			query = "\
				UPDATE user_connection_logs \
				SET \
					session_duration = %{%{Acct-Session-Time}:-0}, \
					bytes_downloaded = %{%{Acct-Input-Octets}:-0}, \
					bytes_uploaded = %{%{Acct-Output-Octets}:-0} \
				WHERE id = ( \
					SELECT id FROM ( \
						SELECT id FROM user_connection_logs \
						WHERE action = 'connect' \
						  AND mac_address = '%{Calling-Station-Id}' \
						ORDER BY id DESC LIMIT 1 \
					) AS tmp \
				)"
		}

		# Called when a session ends — creates a 'disconnect' record
		stop {
			query = "\
				INSERT INTO user_connection_logs \
					(user_id, mac_address, router_id, ip_address, action, session_duration, bytes_uploaded, bytes_downloaded, timestamp) \
				SELECT \
					u.id, \
					'%{Calling-Station-Id}', \
					COALESCE(r.id, 0), \
					'%{NAS-IP-Address}', \
					'disconnect', \
					%{%{Acct-Session-Time}:-0}, \
					%{%{Acct-Output-Octets}:-0}, \
					%{%{Acct-Input-Octets}:-0}, \
					NOW() \
				FROM (SELECT 1) dummy \
				LEFT JOIN users u ON REPLACE(REPLACE(LOWER(u.mac_address), ':', ''), '-', '') = REPLACE(REPLACE(LOWER('%{Calling-Station-Id}'), ':', ''), '-', '') \
				LEFT JOIN mikrotiks r ON r.host = '%{NAS-IP-Address}' OR r.router_id = '%{NAS-Identifier}' \
				LIMIT 1"
		}
	}
}
