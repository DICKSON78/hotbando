upstream hotbando_cluster {
    least_conn;
    server 127.0.0.1:3000;
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name hotbando.com www.hotbando.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hotbando.com www.hotbando.com;

    ssl_certificate /etc/letsencrypt/live/hotbando.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotbando.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;
    client_body_timeout 60s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static files
    location /assets/ {
        alias /var/www/hotbando/public/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /css/ {
        alias /var/www/hotbando/public/css/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /js/ {
        alias /var/www/hotbando/public/js/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /uploads/ {
        alias /var/www/hotbando/public/uploads/;
        expires 1d;
    }

    # Health endpoint (no auth)
    location /health {
        proxy_pass http://hotbando_cluster;
        proxy_http_version 1.1;
    }

    # Metrics endpoint (internal only)
    location /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://hotbando_cluster;
        proxy_http_version 1.1;
    }

    # API rate limiting
    location /api/ {
        proxy_pass http://hotbando_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-MAC $http_x_client_mac;
        proxy_set_header X-Router-ID $http_x_router_id;
        proxy_read_timeout 60s;
    }

    # Main app
    location / {
        proxy_pass http://hotbando_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
}
